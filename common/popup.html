
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 320px;
      padding: 16px;
    }
    h3 { color: #007fa3; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 85px;
      resize: none;
    }
    button {
      background: #009fc7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
    }
    #status {
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h3>MyPeugeot OAuth</h3>
  <textarea id="code" readonly
    placeholder="En attente du code OAuth..."></textarea>
  <button id="copy">Copier le code</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
